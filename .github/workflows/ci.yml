name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  offline:
    name: syntax + offline tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-pango-1.0 python3-numpy python3-pil gcc libwayland-dev libwayland-bin
      - run: cd tex && npm ci --no-audit --no-fund
      - run: ./test.sh
      - name: chalk-cap and the matcher build
        run: cap/build.sh

  sway:
    name: overlay tests in a headless Sway
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends sway foot grim jq wtype zenity wl-clipboard dbus-x11 \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-gtklayershell-0.1 gir1.2-pango-1.0 python3-numpy \
            python3-pil gcc libc6-dev libwayland-dev libwayland-bin fonts-dejavu-core
      - run: cd tex && npm ci --no-audit --no-fund
      - run: cap/build.sh
      - name: tests
        run: |
          # GTK apps (zenity) otherwise wait seconds for an accessibility bus the runner doesn't have, and paint late
          export XDG_RUNTIME_DIR=$(mktemp -d) PATH=$PWD/cap:$PATH NO_AT_BRIDGE=1 GTK_A11Y=none
          chmod 700 "$XDG_RUNTIME_DIR"
          for t in test_watch test_adapt test_panel test_scene test_ask; do
            echo "::group::$t"
            dbus-run-session -- timeout 400 bash bench/$t.sh || { echo "::endgroup::"; bench/headless-sway.sh stop; tail -40 "$XDG_RUNTIME_DIR/chalk-headless/log" || true; exit 1; }
            bench/headless-sway.sh stop; sleep 1
            echo "::endgroup::"
          done

  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the full history
        run: |
          v=8.30.1
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${v}_checksums.txt"
          tar xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --no-banner --redact .
