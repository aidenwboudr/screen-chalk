<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FL Studio 2025 - night_drive.flp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1280px; overflow: hidden; }
  body { font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; font-size: 12px; color: #c3cbd2; background: #2c3338; position: relative; }
  .top { position: absolute; left: 0; right: 0; top: 0; height: 62px; background: #3b4349; border-bottom: 1px solid #1d2226; }
  .menu { position: absolute; left: 10px; top: 6px; display: flex; gap: 9px; font-size: 11px; font-weight: 700; color: #d6dde2; letter-spacing: .3px; }
  .hint { position: absolute; left: 10px; top: 32px; width: 300px; height: 22px; background: #262c30; border-radius: 3px; color: #8fa0ad; font-size: 11px; padding: 4px 8px; }
  .lcd { background: #1a1f22; border-radius: 3px; color: #9ee66b; font-family: 'DejaVu Sans Mono', monospace; display: flex; align-items: center; }
  .btn { background: #4b545b; border-radius: 3px; display: flex; align-items: center; justify-content: center; color: #d0d6db; }
  .browser { position: absolute; left: 0; top: 62px; width: 250px; bottom: 0; background: #2f363b; border-right: 1px solid #1d2226; }
  .browser .h { height: 28px; display: flex; align-items: center; padding: 0 8px; gap: 8px; background: #394147; font-size: 11px; color: #c9d1d7; }
  .browser .it { height: 21px; display: flex; align-items: center; padding-left: 10px; gap: 7px; font-size: 12px; color: #b8c1c8; white-space: nowrap; }
  .browser .it i { font-style: normal; width: 12px; color: #8ca0ae; font-size: 10px; }
  .win { position: absolute; background: #353d43; border: 1px solid #1a1f22; box-shadow: 0 6px 22px #0008; }
  .wtitle { height: 24px; background: #4a535a; display: flex; align-items: center; padding: 0 8px; gap: 8px; font-size: 12px; color: #dfe5e9; }
  .wtitle .x { margin-left: auto; display: flex; gap: 8px; color: #b4bec6; font-size: 11px; }
  .playlist { left: 250px; top: 62px; width: 1670px; height: 408px; box-shadow: none; }
  .mixer { left: 250px; top: 470px; width: 1670px; height: 810px; box-shadow: none; background: #31383d; }
  .rack { left: 300px; top: 96px; width: 800px; height: 238px; z-index: 5; }
  .row { position: absolute; left: 0; right: 0; height: 40px; display: flex; align-items: center; }
  .led { width: 11px; height: 11px; border-radius: 6px; background: #8ee35a; box-shadow: 0 0 4px #8ee35a99, inset 0 -2px 2px #4a8a2a; flex: none; }
  .led.off { background: #3d4a32; box-shadow: inset 0 1px 2px #0008; }
  .chname { width: 112px; height: 26px; background: #59636b; border-radius: 3px; display: flex; align-items: center; padding-left: 8px; color: #e8edf0; font-size: 12px; flex: none; }
  .mixno { width: 26px; height: 20px; background: #262c30; border-radius: 2px; color: #b0d07a; font-size: 11px; display: flex; align-items: center; justify-content: center; flex: none; }
  .steps { display: flex; gap: 3px; margin-left: 10px; }
  .step { width: 28px; height: 30px; border-radius: 3px; background: #4a5359; box-shadow: inset 0 -3px 0 #3c4449; flex: none; }
  .step.alt { background: #5c4547; box-shadow: inset 0 -3px 0 #4a3739; }
  .step.on { background: #d3dadf; box-shadow: inset 0 -3px 0 #a9b3ba; }
  .step.gap { margin-left: 6px; }
  .strip { position: absolute; top: 28px; height: 775px; border-right: 1px solid #262c30; }
  .strip.sel { background: #3a4a3a; }
  .tno { position: absolute; left: 0; right: 0; top: 3px; text-align: center; font-size: 11px; color: #8fa0ad; }
  .tname { position: absolute; left: 3px; right: 3px; top: 20px; height: 18px; background: #262c30; border-radius: 2px; font-size: 10.5px; color: #dfe5e9; text-align: center; line-height: 18px; overflow: hidden; white-space: nowrap; }
  .fx { position: absolute; left: 1350px; top: 28px; width: 318px; bottom: 0; background: #2b3237; border-left: 1px solid #1d2226; }
  .slot { height: 25px; margin: 0 8px 3px; background: #3b444a; border-radius: 2px; display: flex; align-items: center; padding: 0 6px; gap: 8px; font-size: 12px; color: #d6dde2; }
  .slot.empty { color: #6f7d87; background: #343c41; }
  .slot .nm { flex: 1; white-space: nowrap; overflow: hidden; }
  .dd { height: 22px; background: #1f2427; border-radius: 2px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; color: #c3cbd2; }
  svg text { font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; }
</style>
</head>
<body>
<div class="top">
  <div class="menu"><span>FILE</span><span>EDIT</span><span>ADD</span><span>PATTERNS</span><span>VIEW</span><span>OPTIONS</span><span>TOOLS</span><span>HELP</span></div>
  <div class="hint">night_drive.flp · Drums A</div>
  <div class="btn" style="position:absolute;left:350px;top:16px;width:46px;height:30px;font-size:11px;font-weight:700;background:#e08a3c;color:#222">PAT</div>
  <div class="btn" style="position:absolute;left:398px;top:16px;width:46px;height:30px;font-size:11px;font-weight:700">SONG</div>
  <div class="btn" style="position:absolute;left:452px;top:16px;width:34px;height:30px"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z" fill="#9ee66b"/></svg></div>
  <div class="btn" style="position:absolute;left:488px;top:16px;width:34px;height:30px"><svg width="12" height="12"><rect width="12" height="12" fill="#d0d6db"/></svg></div>
  <div class="btn" style="position:absolute;left:524px;top:16px;width:34px;height:30px"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#e05050"/></svg></div>
  <div class="lcd" style="position:absolute;left:570px;top:12px;width:96px;height:38px;font-size:20px;padding-left:8px">128.000</div>
  <div class="lcd" style="position:absolute;left:676px;top:12px;width:132px;height:38px;font-size:22px;padding-left:10px">3:02<span style="font-size:13px;margin-left:3px;margin-top:6px">:12</span></div>
  <div style="position:absolute;left:820px;top:12px;font-size:10px;color:#8fa0ad">PATTERN</div>
  <div class="dd" style="position:absolute;left:820px;top:28px;width:150px"><span style="width:10px;height:10px;background:#d7774a;border-radius:2px;margin-right:6px"></span>Drums A<span style="margin-left:auto">▾</span></div>
  <div style="position:absolute;left:990px;top:12px;font-size:10px;color:#8fa0ad">SNAP</div>
  <div class="dd" style="position:absolute;left:990px;top:28px;width:80px">Line<span style="margin-left:auto">▾</span></div>
  <div style="position:absolute;left:1090px;top:12px;display:flex;gap:4px" id="tbicons"></div>
  <div style="position:absolute;right:16px;top:10px;width:150px;height:42px;background:#262c30;border-radius:3px;font-size:10px;padding:5px 8px;color:#8fa0ad">CPU <span style="color:#9ee66b">23%</span> · POLY <span style="color:#9ee66b">31</span><div style="margin-top:6px;height:8px;background:#1a1f22"><div style="width:23%;height:8px;background:#9ee66b"></div></div></div>
  <div style="position:absolute;right:178px;top:10px;width:140px;height:42px;background:#262c30;border-radius:3px">
    <svg width="140" height="42"><path d="M4 32 L12 28 L20 30 L28 18 L36 24 L44 12 L52 20 L60 26 L68 14 L76 22 L84 30 L92 16 L100 24 L108 20 L116 28 L124 18 L134 22" fill="none" stroke="#9ee66b" stroke-width="1.2"/></svg></div>
</div>

<div class="browser">
  <div class="h"><span>≡</span><span>Browser - All</span><span style="margin-left:auto">⌕</span></div>
  <div id="brw"></div>
</div>

<div class="win playlist">
  <div class="wtitle">Playlist - Arrangement › Drums A<span class="x">— ▢ ✕</span></div>
  <svg id="pl" width="1668" height="382"></svg>
</div>

<div class="win rack">
  <div class="wtitle">Channel rack<span class="dd" style="height:18px;margin-left:10px">Drums<span style="margin-left:14px">▾</span></span>
    <span style="margin-left:14px;font-size:10px;color:#a9b4bc">SWING</span><span data-gt="fl-swing" style="display:inline-flex"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#2b3237" stroke="#1a1f22"/><circle cx="10" cy="10" r="6.2" fill="#5b656c"/><path d="M10 10L5.6 14.4" stroke="#e6ecef" stroke-width="1.8" stroke-linecap="round"/></svg></span>
    <span style="margin-left:16px;display:flex;gap:6px;color:#a9b4bc;font-size:11px"><span>⊞</span><span>▤</span><span>♪</span></span>
    <span class="x">— ▢ ✕</span></div>
  <div id="rackrows" style="position:relative;height:214px"></div>
</div>

<div class="win mixer">
  <div class="wtitle">Mixer - Master<span style="margin-left:16px;display:flex;gap:10px;color:#a9b4bc;font-size:11px"><span>▥</span><span>▦</span><span>▤</span><span>|||</span></span><span class="x">— ▢ ✕</span></div>
  <div id="strips"></div>
  <div class="fx" id="fx"></div>
</div>
<script>
// ---------- toolbar icons ----------
const tbi = ['▶', '⎍', '⌗', '☰', '♫', '⊞', '▦', '⎚', '⚙'];
document.getElementById('tbicons').innerHTML = tbi.map(c => `<div class="btn" style="width:32px;height:36px;font-size:15px">${c}</div>`).join('');
// ---------- browser ----------
const brw = [['▸', 'Current project'], ['▸', 'Recent files'], ['▸', 'Plugin database'], ['▸', 'Plugin presets'], ['▸', 'Channel presets'], ['▸', 'Mixer presets'], ['▸', 'Scores'], ['▾', 'Packs'],
  ['', '  808 Kick'], ['', '  Breakbeat'], ['', '  Drums (ModeAudio)'], ['', '  FX'], ['', '  Hip Hop Drums'], ['', '  Legacy'], ['', '  Loops'], ['', '  Shapes'], ['', '  Vocals'], ['▸', 'Speech'], ['▸', 'User'],
  ['▸', 'Splice'], ['▸', 'Templates'], ['▸', 'Backup'], ['▸', 'Clipboard files'], ['▸', 'Envelopes'], ['▸', 'Impulses'], ['▸', 'Misc'], ['▸', 'My projects'], ['▸', 'Recorded'], ['▸', 'Rendered'], ['▸', 'Sliced audio'], ['▸', 'Soundfonts']];
document.getElementById('brw').innerHTML = brw.map(([i, n]) => `<div class="it"><i>${i || '▫'}</i>${n.trim()}</div>`).join('');

// ---------- knob helper ----------
function knob(size, val, opts = {}) { // val in -1..1 (pan) or 0..1 (level)
  const r = size / 2, a = (opts.uni ? (-135 + val * 270) : val * 135) * Math.PI / 180;
  const x2 = r + Math.sin(a) * (r - 3), y2 = r - Math.cos(a) * (r - 3);
  let arc = '';
  if (!opts.uni && Math.abs(val) > 0.02) {
    const ar = r - 1.2, a0 = 0, sweep = val > 0 ? 1 : 0;
    const ex = r + Math.sin(a) * ar, ey = r - Math.cos(a) * ar;
    arc = `<path d="M${r} ${r - ar} A${ar} ${ar} 0 ${Math.abs(val) * 135 > 180 ? 1 : 0} ${sweep} ${ex.toFixed(2)} ${ey.toFixed(2)}" fill="none" stroke="${opts.col || '#9ee66b'}" stroke-width="1.6"/>`;
  }
  return `<svg width="${size}" height="${size}" style="flex:none;display:block" viewBox="0 0 ${size} ${size}"${opts.gt ? ` data-gt="${opts.gt}"` : ''}><circle cx="${r}" cy="${r}" r="${r - 1}" fill="#22282c"/>${arc}<circle cx="${r}" cy="${r}" r="${r - 3.2}" fill="#5f6a72"/><path d="M${r} ${r}L${x2.toFixed(2)} ${y2.toFixed(2)}" stroke="#eef3f5" stroke-width="1.7" stroke-linecap="round"/></svg>`;
}

// ---------- channel rack ----------
const CH = [
  ['Kick', 1, 0, 0.78, [1, 5, 9, 13, 16]],
  ['Clap', 2, 0.05, 0.70, [5]],
  ['Hat', 3, 0.22, 0.55, [1, 3, 5, 7, 9, 11, 12, 13, 15]],
  ['Perc', 5, -0.3, 0.6, [4, 7, 10, 15]]
];
let rr = '';
CH.forEach(([name, mix, pan, vol, on], i) => {
  rr += `<div class="row" style="top:${8 + i * 50}px;padding-left:10px;gap:8px">`;
  rr += `<span style="color:#7f8d97;font-size:9px">▸</span><div class="led"></div>`;
  rr += knob(20, pan) + knob(20, vol, { uni: 1 });
  rr += `<div class="mixno">${mix}</div><div class="chname">${name}</div>`;
  rr += '<div class="steps">';
  for (let s = 1; s <= 16; s++) {
    const grp = Math.floor((s - 1) / 4) % 2 === 1;
    const gt = name === 'Clap' && s === 13 ? ' data-gt="fl-clap-13"' : '';
    rr += `<div class="step${grp ? ' alt' : ''}${on.includes(s) ? ' on' : ''}${s > 1 && (s - 1) % 4 === 0 ? ' gap' : ''}"${gt}></div>`;
  }
  rr += '</div></div>';
});
document.getElementById('rackrows').innerHTML = rr;

// ---------- playlist ----------
(() => {
  let s = '<rect width="1668" height="382" fill="#343c42"/>';
  s += '<rect x="0" y="0" width="1668" height="22" fill="#2b3237"/>';
  for (let b = 0; b < 33; b++) { const x = 150 + b * 46; s += `<text x="${x + 3}" y="15" font-size="10" fill="#9fb0bc">${b + 1}</text><line x1="${x}" y1="22" x2="${x}" y2="382" stroke="${b % 4 === 0 ? '#2a3136' : '#3a4248'}"/>`; }
  const tracks = [['Drums', '#d7774a'], ['808', '#c2534f'], ['Bass', '#8a63c9'], ['Chords', '#4f8fd0'], ['Pad', '#4bb0a8'], ['Lead', '#d0b14f'], ['Vox Chop', '#d04f8a'], ['Vox Main', '#5fbf6a'], ['FX', '#7f8d97'], ['Automation', '#6f7d87']];
  const clips = { 0: [[0, 8], [8, 8], [16, 8], [24, 8]], 1: [[4, 4], [8, 8], [20, 12]], 2: [[8, 8], [16, 8], [24, 8]], 3: [[0, 16], [16, 16]], 4: [[0, 32]], 5: [[16, 8], [24, 8]], 6: [[8, 4], [14, 2], [24, 4], [30, 2]], 7: [[16, 16]], 8: [[7, 1], [15, 1], [23, 1]], 9: [[0, 32]] };
  tracks.forEach(([n, c], i) => {
    const y = 22 + i * 36;
    s += `<rect x="0" y="${y}" width="148" height="35" fill="#3b444a"/><text x="10" y="${y + 22}" font-size="11.5" fill="#d6dde2">${n}</text><circle cx="134" cy="${y + 18}" r="4" fill="#8ee35a"/>`;
    s += `<line x1="150" y1="${y + 35.5}" x2="1668" y2="${y + 35.5}" stroke="#2a3136"/>`;
    (clips[i] || []).forEach(([b, l]) => {
      const x = 150 + b * 46, w = l * 46 - 2;
      s += `<rect x="${x + 1}" y="${y + 1}" width="${w}" height="33" fill="${c}" opacity=".85" rx="2"/><rect x="${x + 1}" y="${y + 1}" width="${w}" height="11" fill="#0003"/><text x="${x + 5}" y="${y + 10}" font-size="9" fill="#fff">${n === 'Drums' ? 'Drums A' : n}</text>`;
      if (i !== 9) for (let k = 0; k < l * 4; k++) { const hh = 4 + ((k * 7 + i * 3) % 11); s += `<rect x="${x + 4 + k * 11.5}" y="${y + 30 - hh}" width="5" height="${hh}" fill="#fff6"/>`; }
      else s += `<path d="M${x + 2} ${y + 30} C ${x + w * 0.3} ${y + 28}, ${x + w * 0.6} ${y + 14}, ${x + w} ${y + 13}" fill="none" stroke="#fff9" stroke-width="1.5"/>`;
    });
  });
  s += `<line x1="${150 + 9.4 * 46}" y1="0" x2="${150 + 9.4 * 46}" y2="382" stroke="#9ee66b" stroke-width="1.5"/>`;
  document.getElementById('pl').innerHTML = s;
})();

// ---------- mixer strips ----------
// [name, pan(-1..1), fader(0..1), meter(0..1), color, extra]
const TR = [
  ['Master', 0, 0.80, 0.82, '#8ee35a'],
  ['Kick', 0, 0.78, 0.74, '#d7774a'], ['Clap', 0.04, 0.70, 0.52, '#d7774a'], ['Hat', 0.22, 0.62, 0.40, '#d7774a'], ['Snare', 0, 0.68, 0, '#d7774a', 'muted'], ['Perc', -0.30, 0.60, 0.34, '#d7774a'],
  ['808', 0, 0.86, 1.0, '#c2534f'], ['Bass', -1, 0.72, 0.61, '#8a63c9'], ['Chords', 0, 0.64, 0.47, '#4f8fd0'], ['Pad', 0, 0.55, 0.38, '#4bb0a8'], ['Lead', 0.12, 0.70, 0.58, '#d0b14f'],
  ['Vox Chop', -0.18, 0.66, 0.44, '#d04f8a'], ['Arp', 0.35, 0.58, 0.30, '#4f8fd0'], ['FX Riser', 0, 0.50, 0.08, '#7f8d97'], ['Vox Main', 0, 0.76, 0.66, '#5fbf6a'], ['Vox Dbl', 0.42, 0.60, 0.40, '#5fbf6a'],
  ['Reverb Bus', 0, 0.62, 0.28, '#6f7d87'], ['Delay Bus', 0, 0.58, 0.22, '#6f7d87'], ['Drum Bus', 0, 0.74, 0.70, '#d7774a'], ['Insert 19', 0, 0.80, 0, '#5a646b'], ['Insert 20', 0, 0.80, 0, '#5a646b']
];
let st = '';
let x = 0;
TR.forEach(([name, pan, fad, met, col, muted], i) => {
  const w = i === 0 ? 70 : 60;
  st += `<div class="strip${i === 0 ? ' sel' : ''}" style="left:${x}px;width:${w}px">`;
  st += `<div class="tno">${i === 0 ? 'M' : i}</div>`;
  st += `<div class="tname" style="border-bottom:2px solid ${col};${i >= 19 ? 'color:#76838c' : ''}"${i === 6 ? ' data-gt="fl-name-6"' : ''}>${name}</div>`;
  // enable / mute LED
  st += `<div class="led${muted ? ' off' : ''}" style="position:absolute;left:${w / 2 - 6}px;top:48px"${i === 11 ? ' data-gt="fl-mute-11"' : ''}></div>`;
  // pan + stereo separation knobs
  st += `<div style="position:absolute;left:${w / 2 - 12}px;top:68px">${knob(24, pan, { gt: i === 7 ? 'fl-pan-7' : '' })}</div>`;
  st += `<div style="position:absolute;left:${w / 2 - 9}px;top:98px">${knob(18, 0, { col: '#6fb6e6' })}</div>`;
  // fader + meter
  const FT = 130, FH = 520;
  st += `<div style="position:absolute;left:${w / 2 - 3}px;top:${FT}px;width:6px;height:${FH}px;background:#1a1f22;border-radius:3px"></div>`;
  for (let k = 0; k <= 10; k++) st += `<div style="position:absolute;left:${w / 2 + 6}px;top:${FT + k * FH / 10}px;width:${k % 5 ? 4 : 7}px;height:1px;background:#56616a"></div>`;
  const mh = Math.round(met * FH);
  const mgrad = met >= 0.99 ? 'linear-gradient(#ff3b30 0 4%, #f2d64b 4% 22%, #7fd34e 22%)' : met > 0.8 ? `linear-gradient(#f2d64b 0 ${Math.round((met - 0.8) / met * 100)}%, #7fd34e ${Math.round((met - 0.8) / met * 100)}%)` : '#7fd34e';
  st += `<div style="position:absolute;left:${w / 2 - 15}px;top:${FT}px;width:8px;height:${FH}px;background:#1a1f22"${i === 6 ? ' data-gt="fl-meter-6"' : ''}><div style="position:absolute;left:0;bottom:0;width:3px;height:${mh}px;background:${mgrad}"></div><div style="position:absolute;left:4px;bottom:0;width:3px;height:${Math.round(mh * 0.96)}px;background:${mgrad}"></div></div>`;
  if (met >= 0.99) st += `<div style="position:absolute;left:${w / 2 - 16}px;top:${FT - 8}px;width:10px;height:5px;background:#ff3b30;border-radius:1px"></div>`;
  const fy = FT + (1 - fad) * FH;
  st += `<div style="position:absolute;left:${w / 2 - 12}px;top:${fy - 7}px;width:24px;height:14px;background:linear-gradient(#a7b1b8,#6c767d);border-radius:2px;box-shadow:0 2px 3px #0008"><div style="margin:6px 3px 0;height:2px;background:#2b3237"></div></div>`;
  // bottom: routing arrow + send knob
  st += `<div style="position:absolute;left:${w / 2 - 6}px;top:${FT + FH + 22}px"><svg width="12" height="10"><path d="M1 1h10L6 9z" fill="${i > 0 && i < 19 ? '#9ee66b' : '#4a535a'}"/></svg></div>`;
  st += `<div style="position:absolute;left:${w / 2 - 8}px;top:${FT + FH + 40}px">${knob(16, 0.8, { uni: 1, col: '#9ee66b' })}</div>`;
  st += `<div style="position:absolute;left:0;right:0;top:${FT + FH + 64}px;text-align:center;font-size:10px;color:#7f8d97">${i === 0 ? '' : '›'}</div>`;
  st += '</div>';
  x += w;
});
document.getElementById('strips').innerHTML = st;

// ---------- FX panel (Master) ----------
const slots = [['Fruity Parametric EQ 2', 1], ['Fruity Multiband Compressor', 1], ['Soundgoodizer', 0], ['Fruity Limiter', 1], ['', 1], ['', 1], ['', 1], ['', 1], ['', 1], ['', 1]];
let fx = `<div style="padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:12px;color:#dfe5e9"><b>Master</b><span style="margin-left:auto;color:#8fa0ad">⚙</span></div>`;
fx += `<div class="dd" style="margin:0 8px 8px">(none)<span style="margin-left:auto">▾</span></div>`;
slots.forEach(([n, en], i) => {
  fx += `<div class="slot${n ? '' : ' empty'}"><span style="color:#7f8d97;width:12px;font-size:10px">${i + 1}</span><span class="nm">${n || 'Slot ' + (i + 1)}</span>${knob(16, 0.9, { uni: 1 })}<div class="led${en && n ? '' : ' off'}" style="width:9px;height:9px"></div></div>`;
});
fx += `<div style="margin:14px 8px 0;height:150px;background:#1f2427;border-radius:3px;position:relative"><svg width="302" height="150"><path d="M0 90 C40 90 50 70 80 72 S140 96 170 94 S230 60 260 66 S290 80 302 80" fill="none" stroke="#9ee66b" stroke-width="1.5"/><g stroke="#2e353a">${[30, 60, 90, 120].map(y => `<line x1="0" y1="${y}" x2="302" y2="${y}"/>`).join('')}</g></svg>
  <div style="position:absolute;left:8px;bottom:6px;font-size:10px;color:#7f8d97">EQ</div></div>`;
